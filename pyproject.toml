[project]
name = "specterlan"
version = "0.1.0"
description = "Local-first AI network presence monitor for Hacktoberfest Ghost in the Machine"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39",
  "pydantic>=2.8",
  "psutil>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
