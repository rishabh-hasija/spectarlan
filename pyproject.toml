[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specterlan"
version = "0.1.0"
description = "Local-first AI network presence monitor for Hacktoberfest Ghost in the Machine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50",
  "pandas>=2.2",
  "pydantic>=2.8",
  "psutil>=6.0",
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.urls]
Repository = "https://github.com/rishabh-hasija/spectarlan"
Issues = "https://github.com/rishabh-hasija/spectarlan/issues"

[tool.setuptools]
packages = ["specterlan"]

[tool.setuptools.package-data]
specterlan = ["style.css"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
